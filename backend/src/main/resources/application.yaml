server:
  port: 8080
spring:
  application:
    name: datascale
  datasource:
    url: jdbc:postgresql://localhost:5432/datascale
    username: datascale
    password: datascale
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:/db/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      file-size-threshold: 0
app:
  upload:
    dir: /tmp/datascale-uploads
  rabbitmq:
    exchange: ingestion.exchange
    queue: ingestion.queue
    routing-key: ingestion.process
